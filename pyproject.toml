[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-engine"
version = "0.2.0"
description = "Orchestra Engine: coordinate agent sessions like musicians, handing each one's summary and session ID to the next"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erickson Talaue" }]
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "questionary>=2.0",
    # The live view's own window. Linux would need a GTK or Qt stack on top,
    # so there the page opens in the browser instead.
    "pywebview>=5; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Froredion/orchestra-engine"
Issues = "https://github.com/Froredion/orchestra-engine/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orchestra-engine = "orchestra_engine.main:main"

[tool.pytest.ini_options]
# Only this repo's own suite. Agents write tests into their workspace, and
# without this, `pytest` at the root collects those too — a run against a real
# project would break the loop's own test command.
testpaths = ["tests"]
# The eval harnesses are tested too, and live outside the installed package.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orchestra_engine*"]

[tool.setuptools.package-data]
orchestra_engine = ["*.md", "*.html", "*.png", "pipelines/**/*.md", "vendor/*"]
